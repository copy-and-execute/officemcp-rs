[package]
name = "officemcp-rs"
version = "1.0.0"
edition = "2021"
description = "OfficeMCP Rust — MCP server for Word, Excel, PowerPoint, PDF"
license = "MIT"
authors = ["OfficeMCP"]
repository = "https://github.com/OfficeMCP/OfficeMCP"

[[bin]]
name = "officemcp-rs"
path = "src/main.rs"

[dependencies]
# Async / MCP
tokio = { version = "1.38", features = ["full"] }
rmcp = { version = "3.2", features = ["transport-io", "server"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.0", features = ["preserve_order"] }
# Utils
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.11"
base64 = "0.22"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# Office formats
zip = { version = "8.6", features = ["deflate"] }
quick-xml = { version = "0.38", features = ["serialize"] }
docx-rs = "0.4.22"
umya-spreadsheet = "3.1.0"
calamine = "0.36.1"
lopdf = "0.35"
printpdf = "0.7"
pulldown-cmark = "0.11"
image = "0.25"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
